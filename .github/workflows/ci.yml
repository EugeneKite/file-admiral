name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-selftest:
    name: Build and self-test (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build (debug)
        run: swift build

      - name: Build (release)
        run: swift build -c release

      - name: Self-test
        # Drives the real UI in a scratch folder; the macOS runners have a window server.
        run: |
          mkdir -p "$RUNNER_TEMP/selftest"
          FA_SELFTEST="$RUNNER_TEMP/selftest" .build/debug/FileAdmiral 2>&1 | tee selftest.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Upload self-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-log
          path: selftest.log
